    <script>
      (function () {
        var theme = 'dark'
        try {
          var stored = localStorage.getItem('httpproxy.theme')
          if (stored === 'dark' || stored === 'light') theme = stored
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
      })()
